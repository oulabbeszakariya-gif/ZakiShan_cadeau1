<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zaki Shop</title><style>
:root{color-scheme:light dark;--bg:light-dark(#fff8f7,#171214);--card:light-dark(#fff,#21191b);--text:light-dark(#281c1f,#fff5f4);--muted:light-dark(#76666a,#cdbec1);--line:light-dark(#eadcdf,#44373a);--accent:#b94d67;--accent2:#f2c6cf}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}#app{min-height:100vh;background:var(--bg)}header{padding:22px 6%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);z-index:5}.brand{font-size:25px;font-weight:900;color:var(--accent)}.cart{border:0;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer}.hero{padding:55px 6% 35px;text-align:center;background:linear-gradient(135deg,var(--accent2),transparent 55%)}h1{font-size:clamp(34px,6vw,62px);margin:8px 0}.hero p{color:var(--muted);font-size:18px}.wrap{max-width:1200px;margin:auto;padding:28px 6%}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.filter{padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--text);cursor:pointer}.filter.active{background:var(--accent);color:white;border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.product{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}.emoji{font-size:48px}.product h3{margin:0}.price{font-weight:900;color:var(--accent);font-size:19px}.add{border:0;background:var(--accent);color:white;border-radius:12px;padding:11px;cursor:pointer;font-weight:800}.summary{margin-top:30px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px}.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.total{font-size:24px;font-weight:900;margin-top:14px}.buy{margin-top:15px;width:100%;padding:14px;border:0;border-radius:13px;background:#242024;color:#fff;font-weight:900;cursor:pointer}dialog{border:1px solid var(--line);border-radius:22px;background:var(--card);color:var(--text);max-width:460px;width:90%;padding:25px}dialog::backdrop{background:#0008}input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.close{float:left;border:0;background:none;color:var(--muted);font-size:24px}small{color:var(--muted)}
</style></head><body><div id="app"><header><div class="brand">🎁 Zaki Shop</div><button class="cart" onclick="openCart()">السلة (<span id="count">0</span>)</button></header><section class="hero"><div class="wrap"><div style="font-size:45px">🌹 🍫 🖼️ ⌚ 💄 🎀</div><h1>اصنع هديتك بنفسك</h1><p>اختر ما تريد، ونحن نجمعه لك في هدية جميلة.</p><p><strong>التوصيل داخل صفرو ونواحيها</strong></p></div></section><main class="wrap"><div class="filters" id="filters"></div><div class="grid" id="products"></div><section class="summary"><h2>هديتك الحالية</h2><div id="summary"><small>لم تضف أي منتج بعد.</small></div><div class="total">المجموع: <span id="total">0</span> DH</div><button class="buy" onclick="checkout()">إتمام الطلب</button></section></main><dialog id="dlg"><button class="close" onclick="dlg.close()">×</button><h2>إتمام طلب الهدية</h2><p>أدخل بياناتك ليتم إرسال الطلب مباشرة عبر WhatsApp.</p><input id="customerName" placeholder="الاسم"><input id="customerPhone" placeholder="رقم الهاتف"><input id="customerAddress" placeholder="العنوان"><button class="add" style="width:100%" onclick="sendWhatsApp()">إرسال الطلب عبر WhatsApp</button></dialog></div><script>
const products=[['🍫','شوكولاتة فاخرة','حلويات','40'],['🍫','شوكولاتة صغيرة','حلويات','5'],['🌹','وردة','زينة','10'],['💐','باقة ورد','زينة','50'],['🎀','تغليف هدية أنيق','زينة','10'],['🧸','دمية صغيرة','زينة','30'],['💌','بطاقة تهنئة','زينة','5'],['✨','شريط وزينة إضافية','زينة','5'],['💄','كريم أساس','للنساء','35'],['💄','بودرة للوجه','للنساء','25'],['💄','كونسيلر','للنساء','25'],['💄','أحمر شفاه','للنساء','20'],['💄','ماسكارا','للنساء','25'],['💄','آيلاينر','للنساء','20'],['💄','ظلال عيون','للنساء','30'],['💄','أحمر خدود','للنساء','25'],['💄','هايلايتر','للنساء','30'],['💄','محدد شفاه','للنساء','15'],['💄','مزيل مكياج','للنساء','25'],['🌸','عطر نسائي','للنساء','80'],['🌸','عطر رجالي','للرجال','80'],['⌚','ساعة للنساء','للنساء','150'],['⌚','ساعة للرجال','للرجال','150'],['🕶️','نظارات نسائية','للنساء','50'],['🕶️','نظارات رجالية','للرجال','50']];let cart=[];let active='الكل';const cats=['الكل','حلويات','زينة','للنساء','للرجال'];
function renderFilters(){filters.innerHTML=cats.map(c=>`<button class="filter ${c==active?'active':''}" onclick="active='${c}';render()">${c}</button>`).join('')}function render(){renderFilters();productsEl.innerHTML=products.filter(p=>active==='الكل'||p[2]===active).map((p,i)=>`<article class="product"><div class="emoji">${p[0]}</div><h3>${p[1]}</h3><div class="price">${p[3]} DH</div><small>يمكن إضافته إلى صندوقك</small><button class="add" onclick="add('${p[1]}',${p[3]})">+ أضف للسلة</button></article>`).join('');renderCart()}function add(name,price){cart.push({name,price});renderCart()}function renderCart(){count.textContent=cart.length;summary.innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><span>${x.name}</span><span>${x.price} DH <button onclick="cart.splice(${i},1);renderCart()" style="border:0;background:none;cursor:pointer">✕</button></span></div>`).join(''):'<small>لم تضف أي منتج بعد.</small>';total.textContent=cart.reduce((a,x)=>a+Number(x.price),0)}function openCart(){document.querySelector('.summary').scrollIntoView({behavior:'smooth'})}function checkout(){if(!cart.length)return alert('أضف منتجات إلى السلة أولاً 🎁');dlg.showModal()}function sendWhatsApp(){const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),address=document.getElementById('customerAddress').value.trim();if(!name||!phone||!address)return alert('يرجى إدخال الاسم ورقم الهاتف والعنوان');const items=cart.map(x=>`- ${x.name}: ${x.price} DH`).join('%0A'),msg=`طلب جديد من Zaki Shop%0Aالاسم: ${encodeURIComponent(name)}%0Aالهاتف: ${encodeURIComponent(phone)}%0Aالعنوان: ${encodeURIComponent(address)}%0Aالمنتجات:%0A${items}%0Aالمجموع: ${total.textContent} DH`;window.open('https://wa.me/212606242085?text='+msg,'_blank')}const productsEl=document.getElementById('products'),filters=document.getElementById('filters'),summary=document.getElementById('summary'),total=document.getElementById('total'),count=document.getElementById('count'),dlg=document.getElementById('dlg');render();
</script></body></html>
